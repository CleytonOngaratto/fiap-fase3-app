# Segredos da app. SÓ credenciais de banco + SECRET_KEY (hash de senha, lido via
# System.getenv em SecurityAdapter). A chave JWT NÃO entra aqui: ela já vai dentro
# da imagem (classpath) — duplicá-la no Secret não melhora nada e aumenta a superfície.
apiVersion: v1
kind: Secret
metadata:
  name: car-workshop-api-secret
  namespace: car-workshop
  labels:
    app: car-workshop-api
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: postgres
  QUARKUS_DATASOURCE_PASSWORD: postgres
  SECRET_KEY: oficina-secret-key-dev
