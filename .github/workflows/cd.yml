# .github/workflows/cd.yml
#
# CD — prova do fluxo completo exigido pelo desafio (Fase 2):
#   build -> testes -> imagem -> deploy (cluster + banco + app) via Terraform -> smoke test.
#
# ⚠️ O cluster deste pipeline é EFÊMERO: nasce com `medyagh/setup-minikube` e MORRE junto com o
#    job. Isto é PROVA DE PIPELINE, não um ambiente vivo — não há URL persistente. O vídeo demo e a
#    avaliação rodam LOCAL (Minikube na máquina do dono). A autoescala por CPU é demonstrada local.
#
# 🔴 Zero credencial real hardcoded. Os segredos do Terraform (db_password, secret_key) vêm de
#    GitHub Secrets, injetados como TF_VAR_* no env do step de apply (nunca `-var` inline, que
#    vazaria o valor na process list e quebraria com espaços/símbolos).
#    Pré-requisito (uma vez): cadastrar DB_PASSWORD e SECRET_KEY em
#    Settings -> Secrets and variables -> Actions. Em PR de FORK o GitHub zera secrets; o fluxo
#    same-repo (TechChallengePhase2 -> main) tem os secrets disponíveis.
#
# Nota: `maven-ci.yml` (build + test + Trivy) roda no mesmo gatilho. A dupla execução do
# `mvn -B clean verify` é consciente: o `cd` precisa do artefato local para o `docker build`.

name: CD - Build, Image and Deploy (Minikube)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Testes + gate de cobertura (JaCoCo minimum 0.75 no pom) rodam AQUI, não no Dockerfile.
      - name: Build and test with Maven
        run: mvn -B clean verify

      # Imagem multi-stage buildada a partir da raiz. Tag `:ci` = artefato deste job (carregado no
      # cluster efêmero via `minikube image load`, sem ida ao registry).
      - name: Build application image
        run: docker build -t car-workshop-api:ci .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # metrics-server é OBRIGATÓRIO: sem ele o HPA mostra <unknown> e nunca escala.
      - name: Start Minikube (ephemeral)
        uses: medyagh/setup-minikube@latest
        with:
          addons: metrics-server

      # Carrega a imagem local no cluster. Casa com `imagePullPolicy: IfNotPresent` do deployment.
      # Default NÃO é GHCR: pacote no GHCR nasce privado -> o minikube efêmero falharia o pull sem
      # imagePullSecret.
      - name: Load image into Minikube
        run: minikube image load car-workshop-api:ci

      # Segredos por TF_VAR_* (o Terraform lê TF_VAR_<nome> sozinho). app_image não é segredo -> -var.
      - name: Terraform apply (database + app)
        working-directory: infra/terraform/environments/minikube
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve -var app_image=car-workshop-api:ci

      # Espera os dois deployments ficarem prontos. A startupProbe da app tolera até ~150s de boot.
      - name: Wait for rollout
        run: |
          kubectl -n car-workshop rollout status deploy/postgres --timeout=180s
          kubectl -n car-workshop rollout status deploy/car-workshop-api --timeout=300s

      # Loga pods + services + HPA (o HPA deve mostrar % real, não <unknown>).
      - name: Show cluster state
        run: kubectl -n car-workshop get pods,svc,hpa

      # Smoke test do health real (com root-path). O curl roda no runner, não no pod (a base JRE
      # não traz curl). port-forward em background + retry cobre a janela final de readiness.
      - name: Smoke test /health/ready
        run: |
          kubectl -n car-workshop port-forward svc/car-workshop-api 8080:8080 &
          sleep 5
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsS \
            http://localhost:8080/carworkshop/v1/q/health/ready
