# FreezingArchRule store (PLAN.md, Bloco 1.3).
# Frozen violations live in archunit_store/ at the project root and ARE version-controlled,
# so the baseline is shared across machines/CI. New violations break the build; resolved ones
# are pruned from the store automatically as modules are cleaned in Bloco 2.
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
# Never silently re-snapshot the whole baseline; new violations must fail the build.
freeze.refreeze=false
